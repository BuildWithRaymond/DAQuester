name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore DAQuester.slnx -m:1
      - name: Build
        run: dotnet build DAQuester.slnx -c Release --no-restore -m:1
      - name: Unit and protocol tests
        run: dotnet test tests/DAQuester.Tests -c Release --no-build -m:1 --logger trx --results-directory artifacts/test-results
      - name: Avalonia presentation regressions
        run: dotnet test tests/DAQuester.UiTests -c Release --no-build -m:1 --logger trx --results-directory artifacts/test-results
      - name: Avalonia interactions, dark renders and update controls
        run: ./tools/Test-UI.ps1
      - name: Native Avalonia screenshot matrix
        run: ./tools/Capture-Screenshots.ps1
      - name: Package and verify Windows release
        run: ./tools/Build-Release.ps1
      - name: Shipped Avalonia payload smoke
        shell: pwsh
        run: |
          [xml]$props=Get-Content Directory.Build.props
          ./tools/Test-UI.ps1 -Executable "artifacts/package-$($props.Project.PropertyGroup.Version)/DAQuester.exe"
      - name: Older Windows Forms updater compatibility
        run: ./tools/Test-UpdateCompatibility.ps1 -DownloadPrevious
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DAQuester-win-x86
          path: artifacts/release/
          if-no-files-found: error
      - name: Upload test and render evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification
          path: |
            artifacts/test-results/*.trx
            artifacts/*.png
            artifacts/screenshots/**/*.png
            artifacts/*checks.txt
            artifacts/app-smoke.*
            artifacts/screenshots.*
            artifacts/update-compatibility.json
